name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile app/*.py tests/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CRM interface tests
        run: node tests/test_crm_ui.js
      - name: Deployment syntax
        run: bash -n deploy.sh
      - name: Audit runtime dependencies
        run: |
          python -m pip freeze > /tmp/wb-runtime-requirements.txt
          python -m pip install 'pip-audit>=2.10.1,<3'
          python -m pip_audit -r /tmp/wb-runtime-requirements.txt --no-deps --disable-pip
